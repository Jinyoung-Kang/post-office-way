[project]
name = "atlas"
version = "0.1.0"
description = "우체국 접근성 아틀라스 — 수집기·계산·API 공용 패키지"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "redis==5.2.1",
    "httpx==0.28.1",
    "lxml==5.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "respx==0.22.0"]

[project.scripts]
atlas = "atlas.collector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["sql/*.sql", "sql/calc/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: PostGIS 가 필요한 테스트 (TEST_DATABASE_URL 없으면 skip)"]
