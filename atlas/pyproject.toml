[project]
name = "atlas"
version = "0.2.0"
description = "우체국 접근성 아틀라스 — 수집기·계산·API 공용 패키지"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.1",
    "psycopg[binary]==3.3.6",
    "redis==5.3.1",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# ② 도보 경로 — OSM 읽기(osmium)·최단 경로(scipy). 워커·수집기 이미지에만 설치 (API 이미지는 가볍게 유지)
walk = ["osmium==4.3.1", "numpy==2.4.6", "scipy==1.17.1"]

[project.scripts]
atlas = "atlas.collector.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["sql/*.sql", "sql/calc/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: PostGIS 가 필요한 테스트 (TEST_DATABASE_URL 없으면 skip)"]
