# 의존성 업데이트 PR — 주 1회, 생태계마다 minor·patch 를 한 PR 로 묶음.
# 메이저(Next 16·React 19·redis-py 8 등)와 런타임 이미지(Python·Node) 버전 변경은 이전 작업이 필요해 자동 PR 에서 제외하고
# 계획해서 올립니다. 보안 패치는 GitHub 보안 알림(Dependabot security updates)이 따로 올림.
version: 2
updates:
  - package-ecosystem: pip
    directory: /atlas
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/atlas", "/web"]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
