name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "./atlas[dev]"
      - name: 단위·계약·지표 SQL·What-if 동등성 테스트
        working-directory: atlas
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
