name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      ATLAS_MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install --upgrade pip && pip install "./atlas[dev]" pip-audit ruff
      - name: 정적 검사 (pyflakes · 문법)
        run: ruff check --isolated --select F,E9 --target-version py311 atlas/atlas atlas/tests
      - name: 의존성 취약점 (pip-audit)
        run: pip-audit --skip-editable
      - name: 단위·계약·지표 SQL·What-if 동등성·작업 큐·권한 테스트
        working-directory: atlas
        run: pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: 의존성 취약점 (npm audit, high 이상 실패)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: 비밀값 스캔 (gitleaks, 전체 이력)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --no-banner --exit-code 1

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드 (api·worker·web — 비루트 실행 확인)
        run: |
          docker build -q -f atlas/Dockerfile.api -t atlas-api .
          docker build -q -f atlas/Dockerfile.collector -t atlas-collector .
          docker build -q -t atlas-web ./web
          test "$(docker run --rm --entrypoint id atlas-api -u)" = "10001"
          test "$(docker run --rm --entrypoint id atlas-collector -u)" = "10001"
          test "$(docker run --rm --entrypoint id atlas-web -u)" != "0"
