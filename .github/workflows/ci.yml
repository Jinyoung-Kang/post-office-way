name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    services:
      # 캐시·속도 제한 경로도 시험 (테스트는 15번 DB 를 테스트마다 비움)
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas_test
      TEST_REDIS_URL: redis://localhost:6379/15
      ATLAS_MIGRATIONS_DIR: ${{ github.workspace }}/db/migrations
    steps:
      - uses: actions/checkout@v7
      # PostGIS 는 로컬과 같은 db/Dockerfile·로케일(C.UTF-8) — 서비스 컨테이너는 미리 만든 이미지만 받아 직접 빌드해 띄움 (ADR-007).
      # 준비 확인은 TCP 로 — 첫 초기화 중 임시 서버는 소켓에서만 받다가 한 번 재시작함
      - name: PostGIS (db/Dockerfile)
        run: |
          docker build -q -t atlas-db db
          docker run -d --name postgis -p 5432:5432 -e LANG=C.UTF-8 \
            -e POSTGRES_USER=atlas -e POSTGRES_PASSWORD=atlas -e POSTGRES_DB=atlas_test atlas-db
          for i in $(seq 60); do docker exec postgis pg_isready -q -h 127.0.0.1 -U atlas -d atlas_test && break; sleep 2; done
          docker exec postgis psql -U atlas -d atlas_test -Atc "SELECT version(), datcollate FROM pg_database WHERE datname = current_database()"
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      # 러너 기본 파이썬의 pip·setuptools 도 감사 대상이라 함께 올림
      - run: pip install --upgrade pip setuptools && pip install "./atlas[dev,walk]" pip-audit ruff
      - name: 정적 검사 (pyflakes · 문법)
        run: ruff check --isolated --select F,E9 --target-version py311 atlas/atlas atlas/tests
      - name: 의존성 취약점 (pip-audit)
        run: pip-audit --skip-editable
      - name: 단위·계약·지표 SQL·What-if 동등성·작업 큐·권한 테스트
        working-directory: atlas
        run: pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: 의존성 취약점 (npm audit, high 이상 실패)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: 린트 (React Hook 규칙)
        run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: 비밀값 스캔 (gitleaks, 전체 이력)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact --no-banner --exit-code 1

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드 (api·worker·web — 비루트 실행 확인)
        run: |
          docker build -q -f atlas/Dockerfile.api -t atlas-api .
          docker build -q -f atlas/Dockerfile.collector -t atlas-collector .
          docker build -q -t atlas-web ./web
          test "$(docker run --rm --entrypoint id atlas-api -u)" = "10001"
          test "$(docker run --rm --entrypoint id atlas-collector -u)" = "10001"
          test "$(docker run --rm --entrypoint id atlas-web -u)" != "0"
